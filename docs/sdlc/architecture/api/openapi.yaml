      - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    users:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        full_name:
          type: string
        password_hash:
          type: string
        role:
          type: string
        manager_id:
          type: string
          format: uuid
        is_active:
          type: boolean
        deactivated_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
      required:
      - id
      - email
      - full_name
      - role
      - is_active
      - created_at
    sessions:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        token_hash:
          type: string
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        absolute_expires_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
      required:
      - id
      - user_id
      - token_hash
      - created_at
      - last_seen_at
      - expires_at
      - absolute_expires_at
    password_reset_tokens:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        token_hash:
          type: string
        expires_at:
          type: string
          format: date-time
        used_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
      required:
      - id
      - user_id
      - token_hash
      - expires_at
      - created_at
    categories:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        per_line_limit:
          type: number
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
      required:
      - id
      - name
      - is_active
      - created_at
    claims:
      type: object
      properties:
        id:
          type: string
          format: uuid
        reference:
          type: string
        owner_id:
          type: string
          format: uuid
        title:
          type: string
        status:
          type: string
        submitted_at:
          type: string
          format: date-time
        manager_decided_at:
          type: string
          format: date-time
        finance_approved_at:
          type: string
          format: date-time
        paid_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - id
      - reference
      - owner_id
      - status
      - created_at
      - updated_at
    claim_lines:
      type: object
      properties:
        id:
          type: string
          format: uuid
        claim_id:
          type: string
          format: uuid
        line_date:
          type: string
          format: date
        category_id:
          type: string
          format: uuid
        amount_gbp:
          type: number
        description:
          type: string
        receipt_key:
          type: string
        receipt_filename:
          type: string
        receipt_content_type:
          type: string
        receipt_size_bytes:
          type: integer
        position:
          type: string
      required:
      - id
      - claim_id
      - line_date
      - category_id
      - amount_gbp
      - description
      - position
    claim_events:
      type: object
      properties:
        id:
          type: string
        claim_id:
          type: string
          format: uuid
        actor_id:
          type: string
          format: uuid
        action:
          type: string
        from_status:
          type: string
        to_status:
          type: string
        comment:
          type: string
        created_at:
          type: string
          format: date-time
      required:
      - id
      - claim_id
      - actor_id
      - action
      - from_status
      - to_status
      - created_at
